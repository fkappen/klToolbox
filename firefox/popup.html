<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <style>
        /* Neutrale Grundfarben - Firmen-Branding (brandName/brandPrimary/
           brandAccent) kommt erst per Settings-Import und setzt die Variablen. */
        :root {
            --kl-blau: #46626F;
            --kl-blau-dunkel: #35505C;
            --kl-gruen: #7D939E;
            --kl-gruen-dunkel: #5F7683;
        }
        /* Feste Breite NUR fuers Popup - kein max-width/vw hier! Firefox
           misst das Popup anfangs winzig und klemmt den Body sonst darauf
           fest (30px-Streifen). Panel-Modus überschreibt via body.panel. */
        body { font: 13px/1.4 system-ui, sans-serif; width: 372px; margin: 0; padding: 0 12px 10px; color: #26323a; background: #fafcfd; }

        .brand { display: flex; align-items: center; gap: 8px; padding: 8px 2px 6px; margin-bottom: 6px; border-bottom: 2px solid var(--kl-gruen); }
        .brand img { width: 22px; height: 22px; }
        .brand b { font-size: 14px; color: var(--kl-blau-dunkel); font-weight: 700; letter-spacing: .01em; }
        .brand span { color: #9aa7b0; font-size: 11px; margin-top: 2px; }

        h2 { font-size: 11px; margin: 10px 0 5px; color: var(--kl-blau); text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
        .row { display: flex; gap: 6px; }
        input { flex: 1; padding: 6px 10px; border: 1px solid #d5dde2; border-radius: 8px; font: inherit; box-sizing: border-box; background: #fff; }
        input:focus { outline: 2px solid var(--kl-blau); outline-offset: -1px; border-color: var(--kl-blau); }
        button { background: var(--kl-blau); color: #fff; border: 0; border-radius: 8px; padding: 6px 14px; cursor: pointer; font: inherit; font-weight: 600; }
        button:hover { background: var(--kl-blau-dunkel); }
        #hint { color: #b3261e; font-size: 12px; margin-top: 4px; min-height: 14px; }

        #startBar { display: flex; margin-bottom: 4px; }
        #startBtn { width: 100%; background: linear-gradient(135deg, var(--kl-gruen), var(--kl-gruen-dunkel)); color: #fff; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 2px 6px rgba(0, 0, 0, .18); }
        #startBtn:hover { filter: brightness(1.05); }

        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
        .tile { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 7px 2px 5px; border-radius: 10px; cursor: pointer; background: #fff; border: 1px solid #e3eaef; color: #26323a; font: 10.5px/1.2 system-ui, sans-serif; transition: box-shadow .12s, transform .12s, border-color .12s; }
        .tile:hover { border-color: var(--kl-blau); box-shadow: 0 3px 10px rgba(0, 0, 0, .14); transform: translateY(-1px); background: #fff; }
        .tile img { width: 22px; height: 22px; border-radius: 5px; }
        .tile span { max-width: 60px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .tile.private { border-style: dashed; }
        .tile.private span { color: var(--kl-blau-dunkel); }

        .search-btns button { flex: 1; padding: 6px 4px; font-size: 12px; background: #fff; color: var(--kl-blau-dunkel); border: 1px solid #d5dde2; }
        .search-btns button:hover { background: var(--kl-blau); color: #fff; border-color: var(--kl-blau); }
        .search-btns button.default { border-color: var(--kl-blau); box-shadow: inset 0 0 0 1px var(--kl-blau); font-weight: 700; }

        #hint { min-height: 0; }
        #hint:empty { display: none; }

        /* Dynamischer Such-Button: Farbe je nach erkanntem Ziel */
        #searchGo { min-width: 78px; }
        #searchGo.kunde { background: var(--kl-gruen-dunkel); }
        #searchGo.kunde:hover { background: var(--kl-gruen); }
        #searchGo.web { background: #fff; color: var(--kl-blau-dunkel); border: 1px solid #d5dde2; }
        #searchGo.web:hover { background: var(--kl-blau); color: #fff; }

        /* Werkzeug-Buttons unten: schlanke Pills im Stil der Suchbuttons */
        .toolrow { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; padding-top: 8px; border-top: 1px solid #e3eaef; }
        .toolbtn { flex: 1 1 30%; display: flex; align-items: center; justify-content: center; gap: 5px; background: #fff; color: var(--kl-blau-dunkel); border: 1px solid #d5dde2; border-radius: 8px; padding: 6px 6px; font: 11.5px/1.2 system-ui, sans-serif; font-weight: 600; cursor: pointer; white-space: nowrap; }
        .toolbtn:hover { background: var(--kl-blau); color: #fff; border-color: var(--kl-blau); }

        /* Seitenleisten-Modus (popup.html?panel=1): volle Breite nutzen,
           Kacheln fuellen den Platz, KI-Chat fuellt den unteren Bereich */
        #chatFrame { display: none; }
        body.panel { width: auto; max-width: none; box-sizing: border-box; margin: 0; height: 100vh; display: flex; flex-direction: column; overflow-y: auto; }
        body.panel .grid { grid-template-columns: repeat(auto-fill, minmax(68px, 1fr)); }
        body.panel .tile span { max-width: none; }
        body.panel #chatFrame { display: block; flex: 1; min-height: 280px; width: 100%; border: 0; border-top: 2px solid var(--kl-gruen); margin-top: 10px; }
        body.panel #openChat { display: none !important; }
        body.panel .toolrow { grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); }
    </style>
</head>
<body>
    <div class="brand"><img src="icon32.png" alt=""><b id="brandName">klToolbox</b><span id="brandSub"></span></div>
    <div id="startBar"><button id="startBtn">▶ Start – alle öffnen</button></div>

    <div id="sectionsHost"></div>

    <h2>Suche</h2>
    <div class="row" style="margin-bottom:6px;">
        <input type="text" id="searchInput" placeholder="Suchbegriff, Ticket- oder Kundennummer" autofocus>
        <button id="searchGo">Suchen</button>
    </div>
    <div class="row search-btns">
        <button id="sDatev" title="DATEV Wissensplattform">DATEV</button>
        <button id="sGoogle" title="Google-Suche">Google</button>
        <button id="sInno" title="InnoGPT">InnoGPT</button>
    </div>
    <div id="hint"></div>

    <div class="toolrow">
        <button class="toolbtn" id="openChat" title="KI-Chat öffnen">🤖 KI-Chat</button>
        <button class="toolbtn" id="clipPage" title="Aktuelle Seite als bereinigten Artikel exportieren">✂ Clipper</button>
        <button class="toolbtn" id="clearData" title="Browser-Dialog „Browserdaten löschen“ öffnen">🧹 Browserdaten</button>
        <button class="toolbtn" id="resetIncognito" style="display:none;" title="Private Sitzung zurücksetzen (Fenster werden neu geöffnet)">🕶 Inkognito</button>
        <button class="toolbtn" id="openOptions" title="Einstellungen öffnen">⚙ Optionen</button>
        <button class="toolbtn" id="openHelp" title="Hilfe öffnen">❓ Hilfe</button>
    </div>
    <iframe id="chatFrame" title="KI-Chat"></iframe>
    <script src="popup.js"></script>
</body>
</html>
