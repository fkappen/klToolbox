<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>klToolbox KI-Chat</title>
    <link rel="icon" href="icon32.png">
    <style>
        /* Hausschrift Dosis (OFL), self-hosted - kein Netzwerkzugriff */
        @font-face { font-family: "Dosis"; font-style: normal; font-weight: 200 800; font-display: swap; src: url("dosis-latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
        @font-face { font-family: "Dosis"; font-style: normal; font-weight: 200 800; font-display: swap; src: url("dosis-latin-ext.woff2") format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }

        /* Design-Tokens - identisch mit popup.html. Markenfarben (--brand-*)
           neutral vorbelegt, Branding setzt per Import nur diese; hell/dunkel
           als light-dark()-Paare, Schema ueber html[data-theme]. */
        :root {
            color-scheme: light dark;
            --brand-p: #46626F;
            --brand-p-100: #edf0f1;
            --brand-p-300: #b5c0c5;
            --brand-p-600: #3c535e;
            --brand-p-700: #31454e;
            --brand-a: #7D939E;
            --brand-a-600: #6b7e88;

            --font-core: "Dosis", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
            --font-mono: ui-monospace, "Consolas", "Liberation Mono", monospace;

            --text-heading: light-dark(var(--brand-p), var(--brand-a));
            --text-body: light-dark(#3d3d3d, #f1f6f9);
            --text-muted: light-dark(#929292, #9aa9b2);
            --text-subtle: light-dark(#a8a8a8, #6f8290);
            --text-link: light-dark(var(--brand-p), var(--brand-p-300));
            --text-on-accent: #fff;
            --surface-page: light-dark(#f7f9fa, #1b2830);
            --surface-card: light-dark(#fff, #28353c);
            --surface-tint: light-dark(#f1f6f9, #222f36);
            --surface-field: light-dark(#fff, #12191f);
            --surface-accent: light-dark(var(--brand-p), var(--brand-p-600));
            --surface-accent-hover: light-dark(var(--brand-p-600), var(--brand-p));
            --surface-accent-soft: light-dark(var(--brand-p-100), color-mix(in srgb, var(--brand-p) 14%, #12191f));
            --surface-danger-soft: light-dark(#fceaea, #331419);
            --line-hairline: light-dark(#e4e4e4, #1a252d);
            --line-default: light-dark(#bfbfbf, #33424b);
            --line-danger: light-dark(#f5c6c0, #5a2a2e);
            --line-field-focus: light-dark(var(--brand-p), var(--brand-p-300));
            --state-danger: light-dark(#c0392b, #d9544a);
            --bar-fill: light-dark(var(--brand-p), #12191f);
            --bar-strip-fill: var(--brand-a);
            --bar-hover: rgba(255, 255, 255, .14);
            --shadow-inset-field: inset 0 1px 2px light-dark(rgb(0 42 57 / .06), rgb(0 0 0 / .30));
            --shadow-overlay: light-dark(4px 0 18px rgb(0 42 57 / .15), 4px 0 18px rgb(0 0 0 / .5));
            --ring-focus: 0 0 0 3px light-dark(color-mix(in srgb, var(--brand-a) 55%, transparent), color-mix(in srgb, var(--brand-a) 42%, transparent));

            --duration: 180ms;
            --ease: cubic-bezier(.4, 0, .2, 1);
            --transition-control: background-color var(--duration) var(--ease), color var(--duration) var(--ease), border-color var(--duration) var(--ease), box-shadow var(--duration) var(--ease);
        }
        :root[data-theme="light"] { color-scheme: light; }
        :root[data-theme="dark"] { color-scheme: dark; }
        @media (prefers-reduced-motion: reduce) {
            :root { --duration: 0ms; }
        }

        * { box-sizing: border-box; }
        body { font: 400 15px/1.5 var(--font-core); margin: 0; background: var(--surface-page); color: var(--text-body); height: 100vh; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
        button { font-family: var(--font-core); cursor: pointer; transition: var(--transition-control); }
        button:focus-visible, textarea:focus-visible { outline: none; box-shadow: var(--ring-focus); }

        /* Kopf: Marken-Balken (Primaerfarbe, Akzent-Strip an der Unterkante) */
        header { background: var(--bar-fill); color: #fff; padding: 8px 14px; display: flex; align-items: center; gap: 10px; border-bottom: 4px solid var(--bar-strip-fill); }
        .brand-mark { width: 22px; height: 22px; object-fit: contain; flex: none; }
        .brand-dark { display: none; }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) .brand-light { display: none; }
            :root:not([data-theme="light"]) .brand-dark { display: block; }
        }
        :root[data-theme="dark"] .brand-light { display: none; }
        :root[data-theme="dark"] .brand-dark { display: block; }
        header h1 { font-size: 16px; font-weight: 600; letter-spacing: .01em; margin: 0; flex: 1; white-space: nowrap; }
        header .meta { font-size: 12px; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        header button { height: 28px; padding: 0 12px; border-radius: 999px; border: 0; background: transparent; color: #fff; font: 600 12.5px/1 var(--font-core); white-space: nowrap; }
        header button:hover { background: var(--bar-hover); }

        #layout { flex: 1; display: flex; overflow: hidden; position: relative; }
        #sidebar { width: 235px; min-width: 235px; background: var(--surface-card); border-right: 1px solid var(--line-hairline); overflow-y: auto; padding: 8px; }
        .conv { position: relative; padding: 7px 26px 7px 10px; border-radius: 8px; cursor: pointer; transition: var(--transition-control); }
        .conv:hover { background: var(--surface-tint); }
        .conv.active { background: var(--surface-accent-soft); color: var(--text-link); }
        .conv-title { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .conv-date { font-size: 11px; color: var(--text-muted); }
        .conv-del { position: absolute; right: 4px; top: 8px; border: 0; background: transparent; color: var(--text-muted); cursor: pointer; font-size: 13px; display: none; padding: 2px 4px; border-radius: 4px; }
        .conv:hover .conv-del { display: block; }
        .conv-del:hover { color: var(--state-danger); }
        .conv-empty { color: var(--text-muted); font-size: 12px; padding: 10px 6px; }

        main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        #messages { flex: 1; overflow-y: auto; padding: 18px; max-width: 860px; width: 100%; margin: 0 auto; }
        .msg { margin-bottom: 12px; display: flex; }
        .msg .bubble { max-width: 78%; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; word-wrap: break-word; }
        .msg .bubble pre { background: var(--surface-tint); border: 1px solid var(--line-hairline); border-radius: 8px; padding: 10px; overflow-x: auto; white-space: pre; font: 12.5px/1.5 var(--font-mono); margin: 6px 0; }
        .msg .bubble code { background: var(--surface-tint); border-radius: 4px; padding: 1px 5px; font: 12.5px/1.5 var(--font-mono); }
        .msg.user .bubble pre, .msg.user .bubble code { background: rgba(255, 255, 255, .18); border-color: transparent; color: #fff; }
        .msg.user { justify-content: flex-end; }
        .msg.user .bubble { background: var(--surface-accent); color: var(--text-on-accent); border-bottom-right-radius: 4px; }
        .msg.assistant .bubble { background: var(--surface-card); border: 1px solid var(--line-hairline); border-bottom-left-radius: 4px; }
        .msg.error .bubble { background: var(--surface-danger-soft); color: var(--state-danger); border: 1px solid var(--line-danger); }
        .msg.loading .bubble { color: var(--text-muted); font-style: italic; }
        footer { padding: 12px 18px 16px; max-width: 860px; width: 100%; margin: 0 auto; }
        .inputrow { display: flex; gap: 8px; align-items: flex-end; }
        textarea { flex: 1; min-height: 48px; max-height: 200px; padding: 10px 12px; border: 1px solid var(--line-default); border-radius: 8px; font: 400 15px/1.45 var(--font-core); color: var(--text-body); background: var(--surface-field); box-shadow: var(--shadow-inset-field); resize: vertical; transition: var(--transition-control); }
        textarea::placeholder { color: var(--text-subtle); }
        textarea:focus { border-color: var(--line-field-focus); box-shadow: var(--ring-focus); outline: none; }
        #send { height: 40px; padding: 0 20px; border-radius: 999px; border: 1px solid transparent; background: var(--surface-accent); color: var(--text-on-accent); font: 600 14px/1 var(--font-core); }
        #send:hover { background: var(--surface-accent-hover); }
        #send:disabled { opacity: .5; cursor: default; }
        .hint { color: var(--text-muted); font-size: 11.5px; margin-top: 6px; }

        /* Schmale Ansichten (z. B. Seitenleiste): Verlauf als Overlay */
        @media (max-width: 640px) {
            #sidebar { position: absolute; left: 0; top: 0; height: 100%; z-index: 10; transform: translateX(-105%); transition: transform .15s; box-shadow: var(--shadow-overlay); }
            #sidebar.open { transform: none; }
        }
    </style>
</head>
<body>
    <header>
        <button id="convToggle" title="Verlauf ein-/ausblenden">☰</button>
        <img class="brand-mark brand-light" src="icon32.png" alt="">
        <img class="brand-mark brand-dark" src="icon32.png" alt="">
        <h1>KI-Chat</h1>
        <span class="meta" id="meta"></span>
        <button id="newChat">＋ Neuer Chat</button>
    </header>
    <div id="layout">
        <aside id="sidebar">
            <div id="convList"></div>
        </aside>
        <main>
            <div id="messages"></div>
            <footer>
                <div class="inputrow">
                    <textarea id="input" placeholder="Nachricht… (Enter = senden, Shift+Enter = neue Zeile)" autofocus></textarea>
                    <button id="send">Senden</button>
                </div>
                <div class="hint">Anbieter und Modell werden in den Extension-Optionen konfiguriert. Unterhaltungen werden 30 Tage aufbewahrt (nur lokal).</div>
            </footer>
        </main>
    </div>
    <script src="chat.js"></script>
</body>
</html>
