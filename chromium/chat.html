<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>klToolbox KI-Chat</title>
    <link rel="icon" href="icon32.png">
    <style>
        /* Neutrale Grundfarben - Branding kommt per Settings-Import */
        :root { --klt-p: #46626F; --klt-pd: #35505C; --klt-a: #7D939E; }
        * { box-sizing: border-box; }
        body { font: 14px/1.5 system-ui, sans-serif; margin: 0; background: #f4f5f7; color: #222; height: 100vh; display: flex; flex-direction: column; }
        header { background: linear-gradient(135deg, var(--klt-p), var(--klt-pd)); color: #fff; padding: 10px 18px; display: flex; align-items: center; gap: 12px; border-bottom: 3px solid var(--klt-a); }
        header img { width: 24px; height: 24px; }
        header h1 { font-size: 15px; margin: 0; flex: 1; }
        header .meta { font-size: 12px; opacity: .8; }
        header button { background: rgba(255,255,255,.15); border: 0; color: #fff; border-radius: 6px; padding: 6px 12px; cursor: pointer; font: inherit; }
        header button:hover { background: rgba(255,255,255,.28); }

        #layout { flex: 1; display: flex; overflow: hidden; position: relative; }
        #sidebar { width: 235px; min-width: 235px; background: #fff; border-right: 1px solid #e2e4e8; overflow-y: auto; padding: 8px; }
        .conv { position: relative; padding: 7px 26px 7px 10px; border-radius: 8px; cursor: pointer; }
        .conv:hover { background: #eef2f5; }
        .conv.active { background: #e3ecf1; }
        .conv-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .conv-date { font-size: 11px; color: #8a97a0; }
        .conv-del { position: absolute; right: 4px; top: 8px; border: 0; background: transparent; color: #8a97a0; cursor: pointer; font-size: 13px; display: none; padding: 2px 4px; }
        .conv:hover .conv-del { display: block; }
        .conv-del:hover { color: #b3261e; }
        .conv-empty { color: #8a97a0; font-size: 12px; padding: 10px 6px; }

        main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        #messages { flex: 1; overflow-y: auto; padding: 18px; max-width: 860px; width: 100%; margin: 0 auto; }
        .msg { margin-bottom: 12px; display: flex; }
        .msg .bubble { max-width: 78%; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; word-wrap: break-word; }
        .msg .bubble pre { background: #f0f2f4; border: 1px solid #e2e4e8; border-radius: 8px; padding: 10px; overflow-x: auto; white-space: pre; font: 12.5px/1.5 Consolas, monospace; margin: 6px 0; }
        .msg .bubble code { background: #f0f2f4; border-radius: 4px; padding: 1px 5px; font: 12.5px/1.5 Consolas, monospace; }
        .msg.user .bubble pre, .msg.user .bubble code { background: rgba(255,255,255,.18); border-color: transparent; color: #fff; }
        .msg.user { justify-content: flex-end; }
        .msg.user .bubble { background: var(--klt-p); color: #fff; border-bottom-right-radius: 4px; }
        .msg.assistant .bubble { background: #fff; border: 1px solid #e2e4e8; border-bottom-left-radius: 4px; }
        .msg.error .bubble { background: #fdecea; color: #b3261e; border: 1px solid #f5c6c0; }
        .msg.loading .bubble { color: #888; font-style: italic; }
        footer { padding: 12px 18px 16px; max-width: 860px; width: 100%; margin: 0 auto; }
        .inputrow { display: flex; gap: 8px; align-items: flex-end; }
        textarea { flex: 1; min-height: 48px; max-height: 200px; padding: 10px 12px; border: 1px solid #ccc; border-radius: 10px; font: inherit; resize: vertical; }
        #send { background: var(--klt-p); color: #fff; border: 0; border-radius: 10px; padding: 12px 20px; cursor: pointer; font: inherit; font-weight: 600; }
        #send:hover { background: var(--klt-pd); }
        #send:disabled { opacity: .5; cursor: default; }
        .hint { color: #999; font-size: 11px; margin-top: 4px; }

        /* Schmale Ansichten (z. B. Seitenleiste): Verlauf als Overlay */
        @media (max-width: 640px) {
            #sidebar { position: absolute; left: 0; top: 0; height: 100%; z-index: 10; transform: translateX(-105%); transition: transform .15s; box-shadow: 4px 0 18px rgba(0,0,0,.15); }
            #sidebar.open { transform: none; }
        }
    </style>
</head>
<body>
    <header>
        <button id="convToggle" title="Verlauf ein-/ausblenden">☰</button>
        <img src="icon32.png" alt="">
        <h1>KI-Chat</h1>
        <span class="meta" id="meta"></span>
        <button id="newChat">＋ Neuer Chat</button>
    </header>
    <div id="layout">
        <aside id="sidebar">
            <div id="convList"></div>
        </aside>
        <main>
            <div id="messages"></div>
            <footer>
                <div class="inputrow">
                    <textarea id="input" placeholder="Nachricht… (Enter = senden, Shift+Enter = neue Zeile)" autofocus></textarea>
                    <button id="send">Senden</button>
                </div>
                <div class="hint">Anbieter und Modell werden in den Extension-Optionen konfiguriert. Unterhaltungen werden 30 Tage aufbewahrt (nur lokal).</div>
            </footer>
        </main>
    </div>
    <script src="chat.js"></script>
</body>
</html>
