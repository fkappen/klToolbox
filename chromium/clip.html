<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>Clipper</title>
    <link rel="icon" href="icon32.png">
    <style>
        :root { --klt-p: #46626F; --klt-pd: #35505C; --klt-a: #7D939E; }
        * { box-sizing: border-box; }
        body { font: 15px/1.65 system-ui, sans-serif; margin: 0; background: #f4f5f7; color: #26323a; }
        header { position: sticky; top: 0; z-index: 5; background: linear-gradient(135deg, var(--klt-p), var(--klt-pd)); color: #fff; padding: 10px 18px; border-bottom: 3px solid var(--klt-a); }
        .hrow { display: flex; align-items: center; gap: 10px; max-width: 900px; margin: 0 auto; flex-wrap: wrap; }
        header img { width: 22px; height: 22px; }
        header .htitle { font-size: 15px; font-weight: 700; flex: 1; min-width: 160px; }
        header button, header select { background: rgba(255,255,255,.15); border: 0; color: #fff; border-radius: 6px; padding: 6px 11px; cursor: pointer; font: 12.5px system-ui, sans-serif; }
        header button:hover { background: rgba(255,255,255,.3); }
        header select { cursor: pointer; }
        header select option { color: #26323a; }
        .wrap { max-width: 860px; margin: 18px auto 60px; padding: 0 16px; }
        #status { color: #56646d; font-size: 13px; margin: 8px 0; min-height: 16px; }
        #kiResult { display: none; background: #eef4f7; border-left: 4px solid var(--klt-p); border-radius: 0 10px 10px 0; padding: 14px 16px; margin-bottom: 18px; white-space: pre-wrap; }
        #kiResultBar { display: none; gap: 8px; margin: -10px 0 18px; }
        #kiResultBar button { background: var(--klt-p); color: #fff; border: 0; border-radius: 6px; padding: 6px 12px; cursor: pointer; font: 12.5px system-ui, sans-serif; }
        #article { background: #fff; border: 1px solid #e2e6ea; border-radius: 12px; padding: 28px 34px; }
        #article img { max-width: 100%; height: auto; }
        #article figure { margin: 16px 0; }
        #article figcaption { color: #6b7880; font-size: 13px; }
        #article pre { background: #f0f2f4; border-radius: 8px; padding: 12px; overflow-x: auto; }
        #article blockquote { border-left: 4px solid var(--klt-a); margin-left: 0; padding-left: 14px; color: #46545c; }
        #article a { color: var(--klt-p); }
        h1.title { font-size: 26px; line-height: 1.3; margin: 0 0 4px; }
        .meta { color: #6b7880; font-size: 13px; margin-bottom: 18px; }
        .meta a { color: var(--klt-p); }
        .error { background: #fdecea; color: #b3261e; border-radius: 10px; padding: 14px 16px; }
        @media print {
            header, #status, #kiResultBar { display: none !important; }
            body { background: #fff; }
            #article { border: 0; padding: 0; }
        }
    </style>
</head>
<body>
    <header>
        <div class="hrow">
            <img src="icon32.png" alt="">
            <span class="htitle">✂ Clipper</span>
            <button id="copyHtml" title="Formatiert in die Zwischenablage – direkt in OneNote/Word/Outlook einfügbar">📋 Formatiert kopieren</button>
            <button id="copyMd" title="Als Markdown kopieren">📝 Markdown</button>
            <button id="saveHtml" title="Als eigenständige HTML-Datei speichern">💾 HTML</button>
            <button id="printPage" title="Drucken / als PDF speichern">🖨 Drucken</button>
            <button id="mailShare" title="Per E-Mail teilen">✉ Teilen</button>
        </div>
        <div class="hrow" style="margin-top:6px;">
            <span style="font-size:12px; opacity:.85;">KI:</span>
            <select id="kiLang">
                <option value="de" selected>Deutsch</option>
                <option value="en">Englisch</option>
            </select>
            <button id="kiSummary" title="Artikel per KI zusammenfassen">✨ Zusammenfassen</button>
            <button id="kiTranslate" title="Artikel per KI übersetzen">🌐 Übersetzen</button>
        </div>
    </header>

    <div class="wrap">
        <div id="status"></div>
        <div id="kiResult"></div>
        <div id="kiResultBar">
            <button id="kiCopy">📋 Ergebnis kopieren</button>
            <button id="kiMail">✉ Ergebnis teilen</button>
        </div>
        <div id="article"></div>
    </div>

    <script src="clip.js"></script>
</body>
</html>
